esphome:
  name: cippino-riscaldamento
  friendly_name: Cippino Riscaldamento
  area: Riscaldamento
esp8266:
  board: nodemcuv2

logger:

mqtt:
  broker: mqtt.in.tabbo.it
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  log_topic: null
  keepalive: 5s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

one_wire:
  - platform: gpio
    pin: GPIO2 # D4

# Addresses are the sensorlist bytes from heating_sensor.ino, reversed
sensor:
  - platform: dallas_temp
    address: 0x7900080359BA4410
    name: Ritorno 1 Salotto Nord
    id: tubo1
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0xCB00080359845E10
    name: Ritorno 2 Salotto Sud
    id: tubo2
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0x3900080359E50E10
    name: Ritorno 3 Cucina
    id: tubo3
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0x930318600A7BFF28
    name: Ritorno 4 Studio Sud
    id: tubo4
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0xF10318600D93FF28
    name: Ritorno 5 Studio Nord
    id: tubo5
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0xB80318600641FF28
    name: Ritorno 6 Sgabuzzino
    id: tubo6
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0x860318600DAAFF28
    name: Ritorno 7 Camera Est
    id: tubo7
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0xB300080359D32110
    name: Ritorno 8 Camera Ovest
    id: tubo8
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0x9D03186020EEFF28
    name: Ritorno 9 Bagno
    id: tubo9
    accuracy_decimals: 2
    update_interval: 10s

  - platform: dallas_temp
    address: 0x4C03186009FDFF28
    name: Mandata
    id: tubo0
    accuracy_decimals: 2
    update_interval: 10s

  - platform: template
    name: Temperatura Media Ritorno
    id: media_ritorno
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    on_value:
      - component.update: delta_mandata_ritorno
    lambda: |-
      float sum = 0;
      int count = 0;
      for (auto *s : {id(tubo1), id(tubo2), id(tubo3), id(tubo4), id(tubo5),
                      id(tubo6), id(tubo7), id(tubo8), id(tubo9)}) {
        if (!isnan(s->state)) {
          sum += s->state;
          count++;
        }
      }
      if (count == 0) return NAN;
      return sum / count;

  - platform: template
    name: Delta Mandata Ritorno
    id: delta_mandata_ritorno
    unit_of_measurement: "°C"
    device_class: temperature_delta
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      if (isnan(id(tubo0).state) || isnan(id(media_ritorno).state)) return NAN;
      return id(tubo0).state - id(media_ritorno).state;
